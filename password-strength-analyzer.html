<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Password Strength Analyzer</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background: linear-gradient(135deg,#4facfe,#00f2fe);
    }

    .container{
        width:350px;
        background:white;
        padding:30px;
        border-radius:15px;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    h2{
        text-align:center;
        margin-bottom:20px;
        color:#333;
    }

    input{
        width:100%;
        padding:12px;
        border:2px solid #ccc;
        border-radius:8px;
        font-size:16px;
        margin-bottom:15px;
        outline:none;
    }

    .strength-bar{
        width:100%;
        height:10px;
        background:#ddd;
        border-radius:10px;
        overflow:hidden;
        margin-bottom:15px;
    }

    .strength{
        height:100%;
        width:0%;
        transition:0.4s;
    }

    .message{
        font-size:18px;
        font-weight:bold;
        margin-bottom:10px;
    }

    ul{
        margin-top:10px;
        padding-left:20px;
        color:#555;
    }

    .suggestion{
        margin-top:15px;
        color:#222;
        font-size:14px;
    }
</style>
</head>

<body>

<div class="container">
    <h2>Password Strength Analyzer</h2>

    <input type="password" id="password" placeholder="Enter Password" onkeyup="checkPassword()" />

    <div class="strength-bar">
        <div class="strength" id="strength"></div>
    </div>

    <div class="message" id="message"></div>

    <ul id="tips"></ul>

    <div class="suggestion" id="suggestion"></div>
</div>

<script>

function checkPassword(){

    let password = document.getElementById("password").value;

    let strengthBar = document.getElementById("strength");
    let message = document.getElementById("message");
    let tips = document.getElementById("tips");
    let suggestion = document.getElementById("suggestion");

    let score = 0;
    let tipList = [];

    // Length Check
    if(password.length >= 8){
        score++;
    } else {
        tipList.push("Use at least 8 characters");
    }

    // Uppercase Check
    if(/[A-Z]/.test(password)){
        score++;
    } else {
        tipList.push("Add an uppercase letter");
    }

    // Lowercase Check
    if(/[a-z]/.test(password)){
        score++;
    } else {
        tipList.push("Add a lowercase letter");
    }

    // Number Check
    if(/[0-9]/.test(password)){
        score++;
    } else {
        tipList.push("Add a number");
    }

    // Special Character Check
    if(/[!@#$%^&*(),.?":{}|<>]/.test(password)){
        score++;
    } else {
        tipList.push("Add a special character");
    }

    // Display Strength
    if(score <= 2){
        strengthBar.style.width = "33%";
        strengthBar.style.background = "red";
        message.innerHTML = "Weak Password";
        message.style.color = "red";
    }
    else if(score <= 4){
        strengthBar.style.width = "66%";
        strengthBar.style.background = "orange";
        message.innerHTML = "Medium Password";
        message.style.color = "orange";
    }
    else{
        strengthBar.style.width = "100%";
        strengthBar.style.background = "green";
        message.innerHTML = "Strong Password";
        message.style.color = "green";
    }

    // Show Tips
    tips.innerHTML = "";
    tipList.forEach(function(tip){
        let li = document.createElement("li");
        li.textContent = tip;
        tips.appendChild(li);
    });

    // Suggest Strong Password
    if(score < 5 && password.length > 0){
        suggestion.innerHTML =
        "<b>Suggested Strong Password:</b> " +
        generatePassword();
    } else {
        suggestion.innerHTML = "";
    }
}

function generatePassword(){

    let chars =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";

    let newPassword = "";

    for(let i=0;i<12;i++){
        newPassword += chars.charAt(
            Math.floor(Math.random() * chars.length)
        );
    }

    return newPassword;
}

</script>

</body>
</html>
